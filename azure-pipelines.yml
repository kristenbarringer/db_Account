trigger:
  branches:
    include:
      - main
      - Story150432_Sprint2026K_RefactorAzureSQL

pool:
  vmImage: 'windows-latest'

variables:
  sqlServerName: 'asql-tkv2-eastus-dev.database.windows.net'
  databaseName: 'Account'
  projectPath: '**/*.sqlproj'
  ${{ if contains(variables['sqlServerName'], '-dev') }}:
    blockDataLoss: 'false'
    dropObjects: 'false'
  ${{ else }}:
    blockDataLoss: 'true'
    dropObjects: 'false'

steps:
  - checkout: self
    persistCredentials: true
    
  - task: UseDotNet@2
    displayName: 'Use .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '8.x'

  - task: DownloadPipelineArtifact@2
    displayName: 'Download Shared dacpac'
    inputs:
      buildType: 'specific'
      project: 'TKATelematics'
      definition: 'db_Shared'
      buildVersionToDownload: 'latest'
      artifactName: 'shared-dacpac'
      targetPath: '$(Build.SourcesDirectory)/references'
      
  - task: DotNetCoreCLI@2
    displayName: 'Build database project'
    inputs:
      command: 'build'
      projects: '$(projectPath)'
      arguments: '--configuration Release'

  - task: CopyFiles@2
    displayName: 'Copy dacpac to artifact staging'
    inputs:
      contents: '**/bin/Release/*.dacpac'
      targetFolder: '$(Build.ArtifactStagingDirectory)'
      flattenFolders: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish dacpac as artifact'
    inputs:
      pathToPublish: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'dacpac'

  - task: PowerShell@2
    displayName: 'Deploy Shared dacpac to Azure SQL Dev'
    inputs:
      targetType: 'inline'
      script: |
        dotnet tool install -g Microsoft.SqlPackage
        $dacpac = Get-ChildItem -Path "$(Build.SourcesDirectory)/references" -Filter Shared.dacpac -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $dacpac) {
            Write-Error "Shared.dacpac not found in $(Build.SourcesDirectory)/references"
            exit 1
            }
        Write-Host "Deploying shared dacpac: $($dacpac.FullName)"
        SqlPackage /Action:Publish `
          /SourceFile:"$($dacpac.FullName)" `
          /TargetServerName:"$(sqlServerName)" `
          /TargetDatabaseName:"$(databaseName)" `
          /TargetUser:"$(sqlUser)" `
          /TargetPassword:"$(sqlPassword)"
      additionalArguments: '/p:BlockOnPossibleDataLoss=$(blockDataLoss) /p:DropObjectsNotInSource=$(dropObjects)'

  - task: PowerShell@2
    displayName: 'Deploy Account dacpac to Azure SQL Dev'
    inputs:
      targetType: 'inline'
      script: |
        dotnet tool install -g Microsoft.SqlPackage
        $dacpac = Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)" -Filter *.dacpac -Recurse | Select-Object -First 1
        Write-Host "Deploying $($dacpac.FullName)"
        SqlPackage /Action:Publish `
          /SourceFile:"$($dacpac.FullName)" `
          /TargetServerName:"$(sqlServerName)" `
          /TargetDatabaseName:"$(databaseName)" `
          /TargetUser:"$(sqlUser)" `
          /TargetPassword:"$(sqlPassword)"    
      additionalArguments: '/p:BlockOnPossibleDataLoss=$(blockDataLoss) /p:DropObjectsNotInSource=$(dropObjects)'    
       
  - task: PowerShell@2
    displayName: 'Update extended properties'
    continueOnError: true
    inputs:
      targetType: 'inline'
      script: |
        $connString = "Server=tcp:$(sqlServerName),1433;Database=$(databaseName);User ID=$(sqlUser);Password=$(sqlPassword);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

        $conn = New-Object System.Data.SqlClient.SqlConnection($connString)
        $conn.Open()

        # Run the integrity check proc
        $cmd = $conn.CreateCommand()
        $cmd.CommandText = "EXEC dbo.usp_update_extended_properties"
        $cmd.CommandTimeout = 600
        $cmd.ExecuteNonQuery() | Out-Null
        Write-Host "Integrity check proc completed."

        $conn.Close()        
 
  - task: PowerShell@2
    displayName: 'Generate ERD with tbls'
    continueOnError: true
    env:
      SQLPASS: $(sqlPassword)
    inputs:
      targetType: 'inline'
      script: |
        $tblsVersion = 'v1.94.5'
        $zip  = Join-Path $env:AGENT_TEMPDIRECTORY 'tbls.zip'
        $dest = Join-Path $env:AGENT_TEMPDIRECTORY 'tbls'
        Invoke-WebRequest -Uri "https://github.com/k1LoW/tbls/releases/download/$tblsVersion/tbls_${tblsVersion}_windows_amd64.zip" -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dest -Force
 
        Write-Host "Target server: '$(sqlServerName)'  database: '$(databaseName)'  user: '$(sqlUser)'"
 
        $pass = [uri]::EscapeDataString($env:SQLPASS)
        $dsn  = "mssql://$(sqlUser):$pass@$(sqlServerName):1433/$(databaseName)?encrypt=true"
        Set-Location "$(Build.SourcesDirectory)"
 
        $ErrorActionPreference = 'Continue'
        for ($i = 1; $i -le 6; $i++) {
          Write-Host "tbls attempt $i..."
          & "$dest/tbls.exe" doc --force $dsn "$(Build.SourcesDirectory)/docs/erd"
          if ($LASTEXITCODE -eq 0) { Write-Host "ERD generated."; break }
          if ($i -eq 6) { throw "tbls failed after 6 attempts (exit $LASTEXITCODE)." }
          Write-Host "Not ready (exit $LASTEXITCODE). Waiting 20s..."
          Start-Sleep -Seconds 20
        }
 
  - task: PublishPipelineArtifact@1
    displayName: 'Publish ERD artifact'
    continueOnError: true
    inputs:
      targetPath: '$(Build.SourcesDirectory)/docs/erd'
      artifact: 'erd'
  
  - task: PowerShell@2
    displayName: 'Commit ERD to repo'
    continueOnError: true
    inputs:
      targetType: 'inline'
      script: |
        git config user.email "$(Build.RequestedForEmail)"
        git config user.name "$(Build.RequestedFor)"
        git add docs/erd
        $changes = git status --porcelain docs/erd
        if ([string]::IsNullOrWhiteSpace($changes)) {
          Write-Host "No ERD changes to commit."
          exit 0
        }
        git commit -m "Auto-update ERD [skip ci]"
        git push origin "HEAD:$(Build.SourceBranch)"

  - task: PowerShell@2
    displayName: 'Populate test data on DEV'
    continueOnError: true
    inputs:
      targetType: 'inline'
      script: |
        $connString = "Server=tcp:$(sqlServerName),1433;Database=$(databaseName);User ID=$(sqlUser);Password=$(sqlPassword);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

        $conn = New-Object System.Data.SqlClient.SqlConnection($connString)
        $conn.Open()

        # Run the integrity check proc
        $cmd = $conn.CreateCommand()
        $cmd.CommandText = "EXEC dbo.usp_seed_load_all"
        $cmd.CommandTimeout = 600
        $cmd.ExecuteNonQuery() | Out-Null
        Write-Host "Integrity check proc completed."

        $conn.Close()


  - task: PowerShell@2
    displayName: 'Run LOOKUP data integrity checks (non-blocking)'
    continueOnError: true
    inputs:
      targetType: 'inline'
      script: |
        $connString = "Server=tcp:$(sqlServerName),1433;Database=$(databaseName);User ID=$(sqlUser);Password=$(sqlPassword);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

        $conn = New-Object System.Data.SqlClient.SqlConnection($connString)
        $conn.Open()

        # Run the integrity check proc
        $cmd = $conn.CreateCommand()
        $cmd.CommandText = "EXEC dbo.usp_dq_data_integrity_check"
        $cmd.CommandTimeout = 600
        $cmd.ExecuteNonQuery() | Out-Null
        Write-Host "Integrity check proc completed."

        # Query the count of unresolved issues
        $cmd.CommandText = "SELECT COUNT(*) FROM dbo.dq_data_integrity_check WHERE CheckName = 'WrongLookupList' AND ResolvedDate IS NULL"
        $issueCount = $cmd.ExecuteScalar()

        if ($issueCount -gt 0) {
          Write-Host "##vso[task.logissue type=warning]Found $issueCount unresolved data integrity issue(s). Query SELECT * FROM dbo.dq_data_integrity_check WHERE CheckName = WrongLookupList AND ResolvedDate IS NULL for details."
          Write-Host "##vso[task.complete result=SucceededWithIssues;]Pipeline succeeded with warnings."
        } else {
          Write-Host "No data integrity issues found."
        }

        $conn.Close()
        
  - task: PowerShell@2
    displayName: 'Run UUID data integrity checks (non-blocking)'
    continueOnError: true
    inputs:
      targetType: 'inline'
      script: |
        $connString = "Server=tcp:$(sqlServerName),1433;Database=$(databaseName);User ID=$(sqlUser);Password=$(sqlPassword);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

        $conn = New-Object System.Data.SqlClient.SqlConnection($connString)
        $conn.Open()

        # Run the integrity check proc
        $cmd = $conn.CreateCommand()
        $cmd.CommandText = "EXEC dbo.usp_dq_data_integrity_rid_to_uuid_check"
        $cmd.CommandTimeout = 600
        $cmd.ExecuteNonQuery() | Out-Null
        Write-Host "Integrity check proc completed."

        # Query the count of unresolved issues
        $cmd.CommandText = "SELECT COUNT(*) FROM dbo.dq_data_integrity_check WHERE CheckName = 'Wrong_rid_to_uuid' AND ResolvedDate IS NULL"
        $issueCount = $cmd.ExecuteScalar()

        if ($issueCount -gt 0) {
          Write-Host "##vso[task.logissue type=warning]Found $issueCount unresolved data integrity issue(s). Query SELECT * FROM dbo.dq_data_integrity_check WHERE CheckName = Wrong_rid_to_uuid AND ResolvedDate IS NULL for details."
          Write-Host "##vso[task.complete result=SucceededWithIssues;]Pipeline succeeded with warnings."
        } else {
          Write-Host "No data integrity issues found."
        }

        $conn.Close()


        

        
  - task: PowerShell@2
    displayName: 'Run misc data integrity checks (non-blocking)'
    continueOnError: true
    inputs:
      targetType: 'inline'
      script: |
        $connString = "Server=tcp:$(sqlServerName),1433;Database=$(databaseName);User ID=$(sqlUser);Password=$(sqlPassword);Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

        $conn = New-Object System.Data.SqlClient.SqlConnection($connString)
        $conn.Open()

        # Run the integrity check proc
        $cmd = $conn.CreateCommand()
        $cmd.CommandText = "EXEC dbo.usp_dq_data_integrity_misc_check"
        $cmd.CommandTimeout = 600
        $cmd.ExecuteNonQuery() | Out-Null
        Write-Host "Integrity check proc completed."

        # Query the count of unresolved issues
        $cmd.CommandText = "SELECT COUNT(*) FROM dbo.dq_data_integrity_check WHERE coalesce(CheckName, '') not in ('WrongLookupList', 'Wrong_rid_to_uuid') AND ResolvedDate IS NULL"
        $issueCount = $cmd.ExecuteScalar()

        if ($issueCount -gt 0) {
          Write-Host "##vso[task.logissue type=warning]Found $issueCount unresolved data integrity issue(s). Query SELECT * FROM dbo.dq_data_integrity_check WHERE ResolvedDate IS NULL for details."
          Write-Host "##vso[task.complete result=SucceededWithIssues;]Pipeline succeeded with warnings."
        } else {
          Write-Host "No data integrity issues found."
        }

        $conn.Close()